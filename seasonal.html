<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Handle Vault Seasonal & Event Planners: Christmas, birthdays, weddings</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&family=Newsreader:wght@400;500;600&family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Silkscreen:wght@400;700&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:'Figtree',system-ui,sans-serif;color:#2b2030;font-size:14px;background:#fdf1f4;background-image:radial-gradient(60em 40em at 85% -10%,#efe6fb 0,transparent 60%),radial-gradient(50em 36em at -10% 30%,#ffe3ea 0,transparent 55%);background-attachment:fixed}
button,input{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;margin:14px 24px 0;padding:10px 12px 10px 18px;background:rgba(255,255,255,.82);backdrop-filter:blur(10px);border:1px solid #f3dfe6;border-radius:99px}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:30px;height:30px;border-radius:50%;background:#d6336c;color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;font-weight:600}
.brand b{font-family:'Fraunces',serif;font-weight:600;font-size:18px}
.brand .sub{color:#8b7a85;font-size:13px}
.btn{height:38px;padding:0 18px;border-radius:99px;border:1px solid #ecd5de;background:#fff;color:#3b2c40;font-weight:500;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center}
.btn:hover{background:#fff6f8}.btn.pri{background:#d6336c;border-color:#d6336c;color:#fff}.btn.pri:hover{background:#b92a5c}
.btn.big{height:48px;padding:0 28px;font-size:16px}.btn:disabled{opacity:.55;cursor:wait}
.hero{display:grid;grid-template-columns:1.1fr 1fr;align-items:center;gap:24px;max-width:1180px;margin:0 auto;padding:48px 32px 40px}
.hero h1{font-family:'Fraunces',serif;font-weight:600;font-size:clamp(38px,5.4vw,66px);line-height:1.04;letter-spacing:-.02em;margin:0 0 18px}
.hero p{font-size:18px;line-height:1.5;color:#6b5a68;max-width:30em;margin:0 0 26px}
.stack{position:relative;height:410px}
.stack .th{border-radius:6px;box-shadow:0 22px 40px -14px rgba(90,30,60,.4)}
.studio{display:flex;height:max(660px,calc(100vh - 84px));margin:0 24px 28px;border-radius:30px;overflow:hidden;background:#fff;border:1px solid #f3dfe6;box-shadow:0 30px 60px -30px rgba(120,40,80,.35)}
aside{width:360px;flex:none;overflow-y:auto;background:#fffafb;border-right:1px solid #f3dfe6}
aside section{padding:18px 18px 8px}
aside h2{margin:0 0 10px;font-family:'Fraunces',serif;font-weight:600;font-size:17px}
.seg{display:grid;gap:4px;background:#f8ecf0;padding:4px;border-radius:14px;margin-bottom:10px}
.seg button{border:0;background:none;border-radius:10px;padding:8px;color:#74606e;cursor:pointer;text-align:center}
.seg.v button{text-align:left}
.seg button.on{background:#fff;color:#2b2030;font-weight:600;box-shadow:0 1px 3px rgba(120,40,80,.18)}
.seg button:disabled{opacity:.4;cursor:not-allowed}
.pins{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.pin{border:2px solid transparent;background:#fff;border-radius:18px;padding:7px 7px 10px;text-align:left;cursor:pointer;box-shadow:0 2px 10px rgba(120,40,80,.12)}
.pin:nth-child(even){margin-top:22px}
.pin .th{border-radius:11px;overflow:hidden;box-shadow:inset 0 0 0 1px #f0e2e8}
.pin b{display:block;margin:8px 3px 0;font-size:13px}.pin small{display:block;margin:2px 3px 0;color:#8b7a85;font-size:11px;line-height:1.3}
.pin.on{border-color:#d6336c;background:#fff4f7}
.chips{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:12px}
.chip{border:2px solid transparent;background:#fff;border-radius:14px;padding:8px 2px 6px;cursor:pointer;box-shadow:0 1px 6px rgba(120,40,80,.12)}
.chip .dots{display:flex;justify-content:center}.chip .dots i{width:14px;height:14px;border-radius:50%;margin:0 -2px;box-shadow:0 0 0 2px #fff}
.chip small{display:block;margin-top:6px;font-size:10px;color:#74606e}
.chip.on{border-color:#d6336c;background:#fff4f7}
.in{width:100%;height:40px;border:1px solid #ecd5de;border-radius:12px;padding:0 12px;margin-bottom:10px;background:#fff}
.in:disabled{background:#faf3f5;color:#b5a5ae}
.in:focus{outline:2px solid #f3b4ca;border-color:#d6336c}
label.lb{display:block;font-size:12px;color:#8b7a85;margin-bottom:4px}
label.ck2{display:flex;gap:10px;align-items:flex-start;margin-bottom:12px;cursor:pointer;font-weight:500}
label.ck2 small{display:block;color:#8b7a85;font-size:12px;font-weight:400}
label.ck2 input{margin-top:3px;accent-color:#d6336c}
main{position:relative;flex:1;min-width:0;background-color:#f9eef2;background-image:radial-gradient(#e9cfda 1.2px,transparent 1.2px);background-size:22px 22px}
#scroll{position:absolute;inset:0;overflow:auto}
#wrap{min-width:fit-content;min-height:100%;display:flex;flex-direction:column;align-items:center;padding:40px 40px 110px}
#box{flex:none;border-radius:4px;box-shadow:0 2px 4px rgba(90,30,60,.08),0 24px 48px -14px rgba(90,30,60,.35)}
#inner{transform-origin:top left}
.hint{margin-top:16px;font-size:13px;color:#8b7a85}
#bar{position:absolute;left:0;right:0;bottom:20px;display:flex;justify-content:center;pointer-events:none}
#bar>div{pointer-events:auto;display:flex;align-items:center;gap:10px;background:#fff;border:1px solid #f0dce4;border-radius:99px;padding:5px 8px;box-shadow:0 8px 22px rgba(120,40,80,.18)}
#bar button{border:0;background:none;border-radius:99px;padding:6px 14px;color:#74606e;cursor:pointer}
#bar button.on{background:#d6336c;color:#fff}
#nav{display:none;align-items:center;border-left:1px solid #f0dce4;padding-left:10px;color:#74606e}
#nav button{padding:5px 10px;font-size:16px}#nav button:disabled{opacity:.3}
.th{display:block;overflow:hidden;background:#fff}
@media(max-width:900px){.hero{grid-template-columns:1fr;padding:28px 20px}.stack{height:370px;transform:scale(.9);transform-origin:top left}.studio{flex-direction:column;height:auto;margin:0 12px 20px}aside{width:100%;max-height:52vh;border-right:0;border-bottom:1px solid #f3dfe6}main{min-height:75vh}#wrap{padding:20px 20px 110px}.top{margin:10px 12px 0}.brand .sub{display:none}}

.cats{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:6px}
.cat{flex:none;border:1px solid #ecd5de;background:#fff;border-radius:99px;padding:5px 12px;font-size:12px;cursor:pointer;color:#74606e}
.cat.on{background:#d6336c;border-color:#d6336c;color:#fff}
.none{color:#8b7a85;font-size:13px;margin:6px 2px}
.cnt{display:block;color:#8b7a85;font-size:12px;margin:-4px 0 10px}
.chips{grid-template-columns:repeat(5,1fr)}
/* planner page */
.pg{position:relative;display:flex;flex-direction:column;overflow:hidden;background:#fff;color:var(--ink)}
.pg header{flex:none;display:flex;align-items:flex-end;justify-content:space-between;gap:1em;border-bottom:2px solid var(--accent);padding-bottom:.6em}
.pg h1{margin:0;font-size:2em;font-weight:600;line-height:1;letter-spacing:-.02em}
.pg header p{margin:0;font-size:.95em;color:var(--muted);display:flex;align-items:flex-end;gap:.5em}
.bl{display:inline-block;width:11em;height:1.2em;border-bottom:1px solid var(--muted)}
.pb{flex:1;min-height:0;padding-top:1.1em}
.bz{position:absolute;left:0;top:0;bottom:0;background:var(--soft);opacity:.55;border-right:1px dashed var(--accent);pointer-events:none}
.ed{cursor:text;border-radius:.2em;outline:none}
.ed:hover{background:rgba(58,86,212,.08)}.ed:focus{background:rgba(58,86,212,.12);box-shadow:0 0 0 .15em rgba(58,86,212,.35)}
.ed:empty{display:inline-block;min-width:4em}.ed:empty:before{content:attr(data-ph);opacity:.4}
.col{display:flex;flex-direction:column;min-height:0}.g12{gap:1.2em}.g14{gap:1.4em}.f1{flex:1;min-height:0}.fill{height:100%}
.grid2{display:grid;grid-template-rows:minmax(0,1fr);gap:1.6em;min-height:0}
.sec{display:flex;flex-direction:column;min-height:0}
.sh{flex:none;margin-bottom:.55em;padding-bottom:.3em;border-bottom:1px solid var(--accent);font-size:.95em;font-weight:600;color:var(--accent)}
.sb{flex:1;min-height:0;display:flex;flex-direction:column}
.fx1{flex:1}.fx13{flex:1.3}.fx14{flex:1.4}.fx2{flex:2}.nf{flex:none}
.wa{flex:1;min-height:0}
.wa.lined{background-image:linear-gradient(to bottom,transparent 0,transparent 2.3em,var(--line) 2.3em,var(--line) 2.4em);background-size:100% 2.4em}
.wa.dotted{background-image:radial-gradient(circle,var(--muted) .6px,transparent .9px);background-size:1.6em 1.6em;background-position:.8em .8em}
.ck{height:2.4em;display:flex;align-items:center;border-bottom:1px solid var(--line)}
.ck i,.bx{display:block;width:.95em;height:.95em;border:1px solid var(--muted);border-radius:.18em}
.hr{flex:1;min-height:0;display:flex;align-items:flex-end;border-bottom:1px solid var(--line)}
.hr span{width:3.6em;font-size:.8em;color:var(--muted);padding-bottom:.25em}
.pr{height:2.5em;display:flex;align-items:center;border-bottom:1px solid var(--line)}
.pr b{width:1.7em;height:1.7em;border-radius:50%;background:var(--soft);color:var(--accent);font-size:.8em;display:flex;align-items:center;justify-content:center}
.dr{display:inline-block;width:1.5em;height:1.5em;border-radius:50%;border:1px solid var(--accent);margin:0 .6em .6em 0}
.mood{display:flex;flex-wrap:wrap;gap:.7em}
.two{display:grid;grid-template-columns:1fr 1fr;gap:1em;flex:none}
.wr{flex:1;min-height:0;display:flex;gap:.8em;padding:.35em 0;border-bottom:1px solid var(--line)}
.wd{width:3.6em;flex:none}.wd b{display:block;color:var(--accent);font-weight:600}.wd small{font-size:.8em;color:var(--muted)}
.hg{display:grid;grid-template-columns:1fr repeat(7,1.5em);align-items:center}
.hg.hh{font-size:.75em;color:var(--muted);text-align:center;padding-bottom:.2em}
.hg.h6{height:2em;border-bottom:1px solid var(--line)}.hg .bx{margin:auto}
.mh{display:grid;grid-template-columns:repeat(7,1fr);padding-bottom:.4em;text-align:center;font-size:.85em;font-weight:600;color:var(--accent)}
.mg{display:grid;flex:1;min-height:0;grid-template-columns:repeat(7,1fr);border-left:1px solid var(--line);border-top:1px solid var(--line)}
.mc{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:.35em;font-size:.85em;font-weight:500}
.hb{display:grid;border-left:1px solid var(--line);border-top:1px solid var(--line);flex:1;min-height:0}
.hb>div{border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.hb>.hn{display:flex;align-items:center;padding:0 .5em;font-size:.9em}
.hd{display:grid;align-items:end;flex:none}
.hd>div{display:flex;flex-direction:column;align-items:center;padding-bottom:.3em;font-size:.72em;line-height:1.2}
.hd .nm{align-items:flex-start;padding-left:.4em;font-size:1em;font-weight:600;color:var(--accent)}
.hd small{color:var(--muted)}
#ex{position:absolute;top:0;left:-10000px;pointer-events:none}
@media(max-width:900px){.body{flex-direction:column}aside{width:100%;max-height:42vh;border-right:0;border-bottom:1px solid #e4e4e7}#wrap{padding:20px 20px 110px}}
@media print{
 html,body{height:auto;background:#fff}#app{display:none!important}
 #ex{position:static}
 .pg{break-after:page;page-break-after:always;break-inside:avoid;height:calc(var(--ph) - .4mm)!important}
 .pg:last-child{break-after:auto;page-break-after:auto}
 *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

/* cute layer */
.pg.c1,.pg.c2{background-image:radial-gradient(var(--soft) 2px,transparent 2.4px);background-size:16px 16px}
.pg .fr{position:absolute;top:3.5mm;left:3.5mm;right:3.5mm;bottom:3.5mm;border:.14em dashed var(--accent);border-radius:1.4em;opacity:.55;pointer-events:none}
.pg .tp{position:absolute;top:1.4mm;left:50%;width:10em;height:1.7em;margin-left:-5em;background:var(--accent);opacity:.35;transform:rotate(-2deg);border-radius:.2em}
.pg .stk{position:absolute;line-height:1;pointer-events:none}
.pg .em{margin-right:.2em}
.pg .sk{display:inline-block;margin-right:.35em}
.pg.c1 .sec,.pg.c2 .sec{background:var(--soft);border-radius:1.1em;padding:.6em .8em .7em}
.pg.c1 .sh,.pg.c2 .sh{border-bottom:.12em dotted var(--accent)}
.tb{display:grid;flex:1;min-height:0;font-size:.85em}
.tb b{font-weight:600;color:var(--accent);padding:0 .4em .3em;border-bottom:1px solid var(--accent)}
.tb div{border-bottom:1px solid var(--line);border-right:1px solid var(--line);display:flex;align-items:center;justify-content:center;min-height:0}
.lr{flex:1;min-height:2.2em;border-bottom:1px solid var(--line);padding-top:.2em;font-size:.85em;color:var(--muted)}
.dts{display:flex;flex-wrap:wrap;gap:.5em}
.dt{display:block;width:1.4em;height:1.4em;border-radius:50%;border:1px solid var(--accent)}.dt.sm{width:1.15em;height:1.15em}
.yr{display:grid;flex:1;min-height:0;grid-template-columns:2.4em repeat(31,minmax(0,1fr));border-left:1px solid var(--line);border-top:1px solid var(--line);font-size:.75em}
.yr div{border-right:1px solid var(--line);border-bottom:1px solid var(--line)}.yr .ym{display:flex;align-items:center;padding-left:.3em;font-weight:600;color:var(--accent)}

/* style kinds */
.chips{grid-template-columns:1fr 1fr;gap:6px;margin-bottom:4px}
.chip{display:flex;align-items:center;gap:8px;text-align:left;padding:7px 8px}
.chip .dots{flex:none}
.chip small{margin:0;font-size:11.5px;line-height:1.2;color:#4a3a45}
.gh{font-size:11px;font-weight:600;color:#8b7a85;margin:12px 0 6px}
.pg .stk,.pg .sk{color:var(--accent)}
.pg .sk svg,.pg .stk svg{vertical-align:-.15em}
.qt{flex:none;text-align:center;font-style:italic;color:var(--accent);padding-top:.7em;font-size:.95em}
.pg.s-aes:not(.c0){background-image:none}
.pg.s-aes:not(.c0) .fr{border:1px solid var(--accent);border-radius:0;opacity:.7}
.pg.s-aes:not(.c0) .tp{display:none}
.pg.s-aes:not(.c0) .sec{background:none;border-radius:0;border-top:1px solid var(--accent);padding:.5em 0 .6em}
.pg.s-aes:not(.c0) .sh{border-bottom:0;text-transform:uppercase;letter-spacing:.16em;font-size:.78em;margin-bottom:.4em}
.pg.s-aes h1,.pg.s-aes .sh{font-family:'Newsreader',Georgia,serif}
.pg.s-aes .stk{opacity:.6}
.pg.s-pix:not(.c0){background-image:none}
.pg.s-pix:not(.c0) .fr{border:.22em solid var(--accent);border-radius:0;opacity:1}
.pg.s-pix:not(.c0) .tp{display:none}
.pg.s-pix:not(.c0) .sec{background:var(--soft);border:.16em solid var(--accent);border-radius:0;box-shadow:.3em .3em 0 var(--line);padding:.5em .7em .7em}
.pg.s-pix:not(.c0) .sh{background:var(--accent);color:#fff;border:0;padding:.25em .5em;margin:-.5em -.7em .6em}
.pg.s-pix:not(.c0) .sh .sk{color:#fff}
.pg.s-pix h1,.pg.s-pix .sh{font-family:'Silkscreen',monospace}
.pg.s-line:not(.c0){background-image:none}
.pg.s-line:not(.c0) .fr{border:.1em solid var(--ink);border-radius:1.2em;opacity:1}
.pg.s-line:not(.c0) .tp{display:none}
.pg.s-line:not(.c0) .sec{background:none;border:.1em solid var(--ink);border-radius:.8em;padding:.5em .8em .7em}
.pg.s-line:not(.c0) .sh{border-bottom:.1em solid var(--ink)}
.pg.s-line .sh{color:var(--ink);font-size:1.2em}
.pg.s-line h1{font-size:2.4em}
.pg.s-line h1,.pg.s-line .sh{font-family:'Caveat',cursive}
.pg.s-mot:not(.c0){background-image:none}
.pg.s-mot:not(.c0) .fr,.pg.s-mot:not(.c0) .tp{display:none}
.pg.s-mot:not(.c0) .sec{background:var(--soft);border-radius:.5em;border-left:.4em solid var(--accent);padding:.6em .8em .7em}
.pg.s-mot:not(.c0) .sh{border-bottom:0}
.pg.s-mot h1{text-transform:uppercase;font-weight:800}
.pg.s-mot .sh{text-transform:uppercase;letter-spacing:.08em;font-size:.85em}
.pg.s-mot .qt{font-weight:600}
.pg.s-man:not(.c0){background-image:none}
.pg.s-man:not(.c0) .fr{border:.12em solid var(--accent);border-radius:.25em;opacity:.8}
.pg.s-man:not(.c0) .tp{display:none}
.pg.s-man:not(.c0) .sec{background:var(--soft);border-radius:.25em;border-left:.3em solid var(--accent);padding:.6em .8em .7em}
.pg.s-man:not(.c0) .sh{border-bottom:0}
.pg.s-man h1{text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.pg.s-man .sh{text-transform:uppercase;letter-spacing:.1em;font-size:.82em}
.dt.nm{display:flex;align-items:center;justify-content:center;width:2.1em;height:2.1em;font-size:.8em;font-style:normal;color:var(--accent)}

.shop{background:#fff;border:1px solid #f3dfe6;border-radius:18px;padding:14px;margin-bottom:12px}
.price{display:flex;align-items:baseline;gap:10px}.price b{font-family:'Fraunces',serif;font-size:34px;line-height:1;color:#d6336c}.price span{color:#74606e;font-weight:500}
.pn{margin:8px 0 12px;color:#74606e;font-size:12.5px;line-height:1.4}
.shop .btn{width:100%;justify-content:center;text-align:center;height:42px}
.crow{display:flex;gap:6px}.crow .in{margin:0}.crow .btn{width:auto}
#cmsg{display:block;margin-top:6px;font-size:12px;min-height:1em}
.pin{position:relative}.pp{position:absolute;top:13px;right:13px;background:#d6336c;color:#fff;font-size:11px;font-weight:700;border-radius:99px;padding:2px 8px;z-index:2}
.wm{position:absolute;left:0;right:0;top:0;bottom:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:5}
.wm span{transform:rotate(-30deg);font-size:3em;font-weight:700;color:var(--accent);opacity:.17;white-space:nowrap;border:.08em solid var(--accent);padding:.1em .4em}

.pulse{animation:pl 1.1s ease 4}@keyframes pl{50%{box-shadow:0 0 0 7px rgba(214,51,108,.35)}}
.own textarea{width:100%;height:150px;margin:8px 0;font:12px/1.4 ui-monospace,monospace;border:1px solid #ecd5de;border-radius:12px;padding:8px}
.own .row{display:grid;grid-template-columns:30px 1fr 1fr;gap:6px;margin-bottom:6px;align-items:center}.own .row .in{margin:0;height:34px;font-size:12px}
.own .pn{word-break:break-all}

/* v8: dates, unlock plans, quotes, editable fields */
.lockbar{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;max-width:640px;margin:0 0 18px;padding:10px 14px;background:#fff;border:1px solid #f3dfe6;border-radius:16px;box-shadow:0 6px 18px rgba(120,40,80,.12);font-size:13px;color:#4a3a45;text-align:center}
.lockbar[hidden]{display:none}
.lockbar .btn{height:34px;padding:0 14px}
.ustat{display:inline-block;margin-bottom:8px;padding:3px 10px;border-radius:99px;background:#f4f4f5;color:#52525b;font-size:12px;font-weight:600}
.ustat.ok{background:#dcfce7;color:#166534}
.plans{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0}
.plan{display:block;position:relative;text-align:center;text-decoration:none;color:#2b2030;border:1px solid #ecd5de;border-radius:14px;padding:12px 4px 8px;background:#fff}
.plan:hover{background:#fff6f8}.plan b{display:block;font-size:12px}
.plan span{display:block;font-family:'Fraunces',serif;font-size:21px;color:#d6336c;line-height:1.3}
.plan small{display:block;color:#8b7a85;font-size:10.5px;line-height:1.25}

function mount(){const p=P[S.paper],ex=document.createElement('div'),lk=locked();ex.id='ex';ex.innerHTML=`<style>@page{size:${p.w}mm ${p.h}mm;margin:0}</style>`+pages().map(d=>page(d,false,lk)).join('');EDIT=true;document.body.appendChild(ex);return ex}

 finally{unmount();BUSY=false;sync()}};
all();
