<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Planner Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&family=Newsreader:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:'Figtree',system-ui,sans-serif;background:#f6f7f9;color:#18181b;font-size:14px}
button,input{font:inherit}
#app{display:flex;flex-direction:column;height:100vh;background:#fff}
header.top{height:56px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid #e4e4e7}
.brand{font-weight:600;display:flex;align-items:center;gap:10px}
.brand i{width:26px;height:26px;border-radius:7px;background:#3a56d4;display:inline-block}
.btn{height:36px;padding:0 14px;border-radius:7px;border:1px solid #e4e4e7;background:#fff;color:#3f3f46;font-weight:500;cursor:pointer}
.btn:hover{background:#fafafa}.btn.pri{background:#3a56d4;border-color:#3a56d4;color:#fff}.btn.pri:hover{background:#2b43b0}
.btn:disabled{opacity:.55;cursor:wait}
.body{flex:1;min-height:0;display:flex}
aside{width:320px;flex:none;overflow-y:auto;border-right:1px solid #e4e4e7}
aside section{padding:16px;border-bottom:1px solid #f4f4f5}
aside h2{margin:0 0 10px;font-size:12px;font-weight:600;color:#71717a}
.seg{display:grid;gap:4px;background:#f4f4f5;padding:4px;border-radius:9px;margin-bottom:8px}
.seg button,.card{border:0;background:none;border-radius:6px;padding:7px 8px;color:#52525b;cursor:pointer;text-align:center}
.seg.v button{text-align:left}
.seg button.on{background:#fff;color:#18181b;font-weight:500;box-shadow:0 0 0 1px #e4e4e7,0 1px 2px rgba(0,0,0,.06)}
.seg button:disabled{opacity:.4;cursor:not-allowed}
.card{display:block;width:100%;text-align:left;border:1px solid #e4e4e7;margin-bottom:8px;padding:10px;border-radius:9px;background:#fff}
.card small{display:block;color:#71717a;font-size:12px}
.card.on{border-color:#3a56d4;background:#eaeefc;color:#18181b}
.card b{font-weight:500;display:block;color:#18181b}
.sw{display:inline-flex;margin-right:10px}.sw i{width:16px;height:16px;border-radius:50%;box-shadow:0 0 0 2px #fff;margin-right:-4px}
.in{width:100%;height:36px;border:1px solid #e4e4e7;border-radius:7px;padding:0 10px;margin-bottom:10px}
.in:disabled{background:#fafafa;color:#a1a1aa}
label.lb{display:block;font-size:12px;color:#71717a;margin-bottom:4px}
label.ck2{display:flex;gap:10px;align-items:flex-start;margin-bottom:10px;cursor:pointer}
label.ck2 small{display:block;color:#71717a;font-size:12px}
label.ck2 input{margin-top:3px;accent-color:#3a56d4}
main{position:relative;flex:1;min-width:0;background:#f4f4f5}
#scroll{position:absolute;inset:0;overflow:auto}
#wrap{min-width:fit-content;min-height:100%;display:flex;flex-direction:column;align-items:center;padding:40px 40px 110px}
#box{flex:none;box-shadow:0 1px 2px rgba(16,24,40,.06),0 14px 36px -10px rgba(16,24,40,.22)}
#inner{transform-origin:top left}
.hint{margin-top:14px;font-size:12px;color:#71717a}
#bar{position:absolute;left:0;right:0;bottom:20px;display:flex;justify-content:center;pointer-events:none}
#bar>div{pointer-events:auto;display:flex;align-items:center;gap:10px;background:#fff;border:1px solid #e4e4e7;border-radius:99px;padding:5px 8px;box-shadow:0 4px 12px rgba(0,0,0,.1)}
#bar button{border:0;background:none;border-radius:99px;padding:5px 12px;color:#52525b;cursor:pointer}
#bar button.on{background:#18181b;color:#fff}
#nav{display:none;align-items:center;border-left:1px solid #e4e4e7;padding-left:10px;color:#52525b}
#nav button{padding:5px 9px;font-size:16px}
#nav button:disabled{opacity:.3}
/* planner page */
.pg{position:relative;display:flex;flex-direction:column;overflow:hidden;background:#fff;color:var(--ink)}
.pg header{flex:none;display:flex;align-items:flex-end;justify-content:space-between;gap:1em;border-bottom:2px solid var(--accent);padding-bottom:.6em}
.pg h1{margin:0;font-size:2em;font-weight:600;line-height:1;letter-spacing:-.02em}
.pg header p{margin:0;font-size:.95em;color:var(--muted);display:flex;align-items:flex-end;gap:.5em}
.bl{display:inline-block;width:11em;height:1.2em;border-bottom:1px solid var(--muted)}
.pb{flex:1;min-height:0;padding-top:1.1em}
.bz{position:absolute;left:0;top:0;bottom:0;background:var(--soft);opacity:.55;border-right:1px dashed var(--accent);pointer-events:none}
.ed{cursor:text;border-radius:.2em;outline:none}
.ed:hover{background:rgba(58,86,212,.08)}.ed:focus{background:rgba(58,86,212,.12);box-shadow:0 0 0 .15em rgba(58,86,212,.35)}
.ed:empty{display:inline-block;min-width:4em}.ed:empty:before{content:attr(data-ph);opacity:.4}
.col{display:flex;flex-direction:column;min-height:0}.g12{gap:1.2em}.g14{gap:1.4em}.f1{flex:1;min-height:0}.fill{height:100%}
.grid2{display:grid;grid-template-rows:minmax(0,1fr);gap:1.6em;min-height:0}
.sec{display:flex;flex-direction:column;min-height:0}
.sh{flex:none;margin-bottom:.55em;padding-bottom:.3em;border-bottom:1px solid var(--accent);font-size:.95em;font-weight:600;color:var(--accent)}
.sb{flex:1;min-height:0;display:flex;flex-direction:column}
.fx1{flex:1}.fx13{flex:1.3}.fx14{flex:1.4}.fx2{flex:2}.nf{flex:none}
.wa{flex:1;min-height:0}
.wa.lined{background-image:linear-gradient(to bottom,transparent 0,transparent 2.3em,var(--line) 2.3em,var(--line) 2.4em);background-size:100% 2.4em}
.wa.dotted{background-image:radial-gradient(circle,var(--muted) .6px,transparent .9px);background-size:1.6em 1.6em;background-position:.8em .8em}
.ck{height:2.4em;display:flex;align-items:center;border-bottom:1px solid var(--line)}
.ck i,.bx{display:block;width:.95em;height:.95em;border:1px solid var(--muted);border-radius:.18em}
.hr{flex:1;min-height:0;display:flex;align-items:flex-end;border-bottom:1px solid var(--line)}
.hr span{width:3.6em;font-size:.8em;color:var(--muted);padding-bottom:.25em}
.pr{height:2.5em;display:flex;align-items:center;border-bottom:1px solid var(--line)}
.pr b{width:1.7em;height:1.7em;border-radius:50%;background:var(--soft);color:var(--accent);font-size:.8em;display:flex;align-items:center;justify-content:center}
.dr{display:inline-block;width:1.5em;height:1.5em;border-radius:50%;border:1px solid var(--accent);margin:0 .6em .6em 0}
.mood{display:flex;flex-wrap:wrap;gap:.7em}
.two{display:grid;grid-template-columns:1fr 1fr;gap:1em;flex:none}
.wr{flex:1;min-height:0;display:flex;gap:.8em;padding:.35em 0;border-bottom:1px solid var(--line)}
.wd{width:3.6em;flex:none}.wd b{display:block;color:var(--accent);font-weight:600}.wd small{font-size:.8em;color:var(--muted)}
.hg{display:grid;grid-template-columns:1fr repeat(7,1.5em);align-items:center}
.hg.hh{font-size:.75em;color:var(--muted);text-align:center;padding-bottom:.2em}
.hg.h6{height:2em;border-bottom:1px solid var(--line)}.hg .bx{margin:auto}
.mh{display:grid;grid-template-columns:repeat(7,1fr);padding-bottom:.4em;text-align:center;font-size:.85em;font-weight:600;color:var(--accent)}
.mg{display:grid;flex:1;min-height:0;grid-template-columns:repeat(7,1fr);border-left:1px solid var(--line);border-top:1px solid var(--line)}
.mc{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:.35em;font-size:.85em;font-weight:500}
.hb{display:grid;border-left:1px solid var(--line);border-top:1px solid var(--line);flex:1;min-height:0}
.hb>div{border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.hb>.hn{display:flex;align-items:center;padding:0 .5em;font-size:.9em}
.hd{display:grid;align-items:end;flex:none}
.hd>div{display:flex;flex-direction:column;align-items:center;padding-bottom:.3em;font-size:.72em;line-height:1.2}
.hd .nm{align-items:flex-start;padding-left:.4em;font-size:1em;font-weight:600;color:var(--accent)}
.hd small{color:var(--muted)}
#ex{position:absolute;top:0;left:-10000px;pointer-events:none}
@media(max-width:900px){.body{flex-direction:column}aside{width:100%;max-height:42vh;border-right:0;border-bottom:1px solid #e4e4e7}#wrap{padding:20px 20px 110px}}
@media print{
 html,body{height:auto;background:#fff}#app{display:none!important}
 #ex{position:static}
 .pg{break-after:page;page-break-after:always;break-inside:avoid;height:calc(var(--ph) - .4mm)!important}
 .pg:last-child{break-after:auto;page-break-after:auto}
 *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<div id="app">
 <header class="top">
  <div class="brand"><i></i>Planner Studio</div>
  <div><button class="btn" id="print">Print</button> <button class="btn pri" id="pdf">Download PDF</button></div>
 </header>
 <div class="body">
  <aside id="side"></aside>
  <main>
   <div id="scroll"><div id="wrap"><div id="box"><div id="inner"></div></div><p class="hint">Click any heading on the page to rename it.</p></div></div>
   <div id="bar"><div><span id="zoom"></span><span id="nav"><button id="prev" aria-label="Previous page">‹</button><span id="pn"></span><button id="next" aria-label="Next page">›</button></span></div></div>
  </main>
 </div>
</div>
<script>
const $=s=>document.querySelector(s);
const P={a4:{l:'A4',s:'210 × 297 mm',w:210,h:297,f:11,m:12},a5:{l:'A5',s:'148 × 210 mm',w:148,h:210,f:8.4,m:9},letter:{l:'US Letter',s:'8.5 × 11 in',w:215.9,h:279.4,f:11,m:12}};
const T={mono:['Minimalist Mono','#18181b','#27272a','#f1f1f2','#d4d4d8','#71717a'],sage:['Sage Green','#1f2a24','#5a7d64','#e8f0ea','#c2d3c6','#6b7d70'],terracotta:['Warm Terracotta','#2b1d18','#b4553a','#f8e8e0','#e5c5b8','#8a6a5f'],blue:['Dusty Blue','#1d2733','#4f7396','#e5ecf3','#bccbd9','#66788a'],lilac:['Soft Lilac','#272033','#8570b0','#eee9f6','#d3c8e6','#7a6e91']};
const F={sans:['Clean Sans-Serif',"'Figtree',system-ui,sans-serif"],serif:['Editorial Serif',"'Newsreader',Georgia,serif"],mono:['Modern Monospace',"'JetBrains Mono',ui-monospace,monospace"]};
const TP={daily:['Daily planner','Hourly schedule, priorities, to-do, water and mood'],weekly:['Weekly spread','Seven day blocks, habits and weekly goals'],monthly:['Monthly calendar','Month grid with a focus area and notes'],habit:['Habit & goal tracker','31-day matrix with reflection prompts']};
const LS={lined:'Lined',dotted:'Dotted grid',blank:'Blank',check:'Checklist'};
const MN=['January','February','March','April','May','June','July','August','September','October','November','December'],MS=MN.map(x=>x.slice(0,3));
const DN=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'],DS=DN.map(x=>x.slice(0,3));
const pad=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const addD=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);
const dim=(y,m)=>new Date(y,m+1,0).getDate();
const DEF={tpl:'daily',paper:'a4',theme:'sage',font:'sans',line:'lined',title:'My Planner',showDate:true,date:iso(new Date()),ws:'mon',binder:false,zoom:75,scope:'single',heads:{}};
let S=Object.assign({},DEF,(()=>{try{return JSON.parse(localStorage.getItem('planner-studio')||'{}')}catch(e){return{}}})());
const save=()=>{try{localStorage.setItem('planner-studio',JSON.stringify(S))}catch(e){}};
let pi=0,EDIT=true;
const sow=d=>addD(d,-(S.ws==='mon'?(d.getDay()+6)%7:d.getDay()));
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
function ed(id,def,ph){const v=S.heads[id]!==undefined?S.heads[id]:def;return EDIT?`<span class="ed" contenteditable spellcheck="false" data-h="${id}" data-ph="${ph||'Add text'}">${esc(v)}</span>`:`<span>${esc(v)}</span>`}
const sec=(id,t,c,b)=>`<section class="sec ${c}"><div class="sh">${ed(id,t)}</div><div class="sb">${b}</div></section>`;
function wa(fc){let l=S.line;if(fc&&l==='lined')l='check';if(l==='check')return`<div class="wa" style="overflow:hidden">${'<div class="ck"><i></i></div>'.repeat(40)}</div>`;return`<div class="wa ${l}"></div>`}
function face(i){const c=T[S.theme][2],m=['M8 16Q12 12 16 16','M8 15H16','M8 14Q12 18 16 14','M7 13Q12 20 17 13Z','M7 12Q12 22 17 12Z'][i];return`<svg width="1.7em" height="1.7em" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9 9h.01M15 9h.01"/><path d="${m}"/></svg>`}
function daily(){
 const hrs=[...Array(16)].map((_,i)=>{const h=i+6;return`<div class="hr"><span>${h%12||12} ${h>=12?'PM':'AM'}</span></div>`}).join('');
 const pr=[1,2,3].map(n=>`<div class="pr"><b>${n}</b></div>`).join('');
 return`<div class="col g14 fill"><div class="grid2 f1" style="grid-template-columns:1.35fr 1fr">${sec('daily.schedule','Schedule','',hrs)}<div class="col g12">${sec('daily.priorities','Top 3 priorities','nf',pr)}${sec('daily.todo','To-do','fx14',wa(1))}<div class="two">${sec('daily.water','Water','','<div>'+'<i class="dr"></i>'.repeat(8)+'</div>')}${sec('daily.mood','Mood','','<div class="mood">'+[0,1,2,3,4].map(face).join('')+'</div>')}</div></div></div>${sec('daily.notes','Notes','nf" style="height:17%',wa())}</div>`}
function weekly(d){
 const ds=[...Array(7)].map((_,i)=>addD(sow(d),i));
 const rows=ds.map(x=>`<div class="wr"><div class="wd"><b>${DS[x.getDay()]}</b>${S.showDate?`<small>${x.getDate()} ${MS[x.getMonth()]}</small>`:''}</div>${wa()}</div>`).join('');
 const hh=`<div class="hg hh"><span></span>${ds.map(x=>`<span>${DS[x.getDay()][0]}</span>`).join('')}</div>`+[...Array(6)].map(()=>`<div class="hg h6"><span></span>${ds.map(()=>'<i class="bx"></i>').join('')}</div>`).join('');
 return`<div class="grid2 fill" style="grid-template-columns:1.7fr 1fr"><div class="col">${rows}</div><div class="col g12">${sec('weekly.goals','Weekly goals','fx1',wa(1))}${sec('weekly.habits','Habit tracker','nf',hh)}${sec('weekly.notes','Notes','fx13',wa())}</div></div>`}
function monthly(d){
 const y=d.getFullYear(),m=d.getMonth(),f=new Date(y,m,1).getDay(),off=S.ws==='mon'?(f+6)%7:f,n=dim(y,m),rows=S.showDate?Math.ceil((off+n)/7):6;
 const wk=[...Array(7)].map((_,i)=>S.ws==='mon'?(i+1)%7:i);
 const cells=[...Array(rows*7)].map((_,i)=>{const k=i-off+1;return`<div class="mc"${wk[i%7]%6===0?' style="background:var(--soft)"':''}>${S.showDate&&k>=1&&k<=n?k:''}</div>`}).join('');
 return`<div class="grid2 fill" style="grid-template-columns:2.6fr 1fr;gap:1.4em"><div class="col"><div class="mh">${wk.map(x=>`<span>${DS[x]}</span>`).join('')}</div><div class="mg" style="grid-template-rows:repeat(${rows},minmax(0,1fr))">${cells}</div></div><div class="col g12">${sec('monthly.focus','Monthly focus','fx1',wa())}${sec('monthly.notes','Notes','fx2',wa())}</div></div>`}
function habit(d){
 const y=d.getFullYear(),m=d.getMonth(),n=S.showDate?dim(y,m):31,cols=`20% repeat(${n},minmax(0,1fr))`;
 const head=`<div class="hd" style="grid-template-columns:${cols}"><div class="nm">${ed('habit.column','Habit')}</div>${[...Array(n)].map((_,i)=>`<div><small>${S.showDate?DS[new Date(y,m,i+1).getDay()][0]:'&nbsp;'}</small><b>${i+1}</b></div>`).join('')}</div>`;
 const R=14,body=[...Array(R)].map((_,r)=>`<div class="hn">${ed('habit.row.'+r,'','Add habit')}</div>`+'<div></div>'.repeat(n)).join('');
 return`<div class="col g14 fill"><div class="col" style="flex:1.7">${head}<div class="hb" style="grid-template-columns:${cols};grid-template-rows:repeat(${R},minmax(0,1fr))">${body}</div></div><div class="grid2 f1" style="grid-template-columns:repeat(3,1fr);gap:1.4em">${sec('habit.goals',"This month's goals",'',wa(1))}${sec('habit.wins','What went well?','',wa())}${sec('habit.change','What will I change?','',wa())}</div></div>`}
const BL={daily:'Date',weekly:'Week of',monthly:'Month',habit:'Month'};
function hdText(d){if(S.tpl==='daily')return`${DN[d.getDay()]}, ${d.getDate()} ${MN[d.getMonth()]} ${d.getFullYear()}`;if(S.tpl==='weekly'){const a=sow(d),b=addD(a,6);return`${a.getDate()} ${MS[a.getMonth()]} – ${b.getDate()} ${MS[b.getMonth()]} ${b.getFullYear()}`}return`${MN[d.getMonth()]} ${d.getFullYear()}`}
function page(d,edit){
 EDIT=edit;const p=P[S.paper],t=T[S.theme],L=p.m+(S.binder?8:0);
 const body=({daily,weekly,monthly,habit})[S.tpl](d);
 return`<div class="pg" data-pg style="--ink:${t[1]};--accent:${t[2]};--soft:${t[3]};--line:${t[4]};--muted:${t[5]};--ph:${p.h}mm;width:${p.w}mm;height:${p.h}mm;padding:${p.m}mm ${p.m}mm ${p.m}mm ${L}mm;font-size:${p.f}px;font-family:${F[S.font][1]}">${edit&&S.binder?`<div class="bz" style="width:${L}mm"></div>`:''}<header><h1>${EDIT?`<span class="ed" contenteditable spellcheck="false" data-h="__t" data-ph="Planner title">${esc(S.title)}</span>`:esc(S.title)}</h1><p>${S.showDate?hdText(d):`${BL[S.tpl]} <span class="bl"></span>`}</p></header><div class="pb">${body}</div></div>`}
const scope=()=>S.showDate?S.scope:'single';
function pages(){const a=parse(S.date),y=a.getFullYear(),m=a.getMonth();if(scope()==='single')return[a];
 if(S.tpl==='daily')return[...Array(dim(y,m))].map((_,i)=>new Date(y,m,i+1));
 if(S.tpl==='weekly')return[...Array(4)].map((_,i)=>addD(sow(a),i*7));
 return[...Array(12)].map((_,i)=>new Date(y,m+i,1))}
function batchLabel(){const a=parse(S.date);const n=S.tpl==='daily'?dim(a.getFullYear(),a.getMonth()):S.tpl==='weekly'?4:12;
 return S.tpl==='daily'?`Full month: ${MN[a.getMonth()]} (${n} pages)`:S.tpl==='weekly'?'Next 4 weeks (4 pages)':`12 months from ${MS[a.getMonth()]} ${a.getFullYear()} (12 pages)`}
function seg(k,opts,cls,cols){return`<div class="seg ${cls||''}" style="grid-template-columns:repeat(${cols||opts.length},1fr)">${opts.map(o=>`<button data-k="${k}" data-v="${o[0]}"${o[2]?` style="font-family:${o[2]}"`:''}>${o[1]}</button>`).join('')}</div>`}
function buildSide(){
 $('#side').innerHTML=`<section><h2>Template</h2>${Object.entries(TP).map(([k,v])=>`<button class="card" data-k="tpl" data-v="${k}"><b>${v[0]}</b><small>${v[1]}</small></button>`).join('')}</section>
 <section><h2>Paper size</h2>${seg('paper',Object.entries(P).map(([k,v])=>[k,v.l]))}<small style="color:#71717a" id="psz"></small></section>
 <section><h2>Color theme</h2>${Object.entries(T).map(([k,v])=>`<button class="card" data-k="theme" data-v="${k}"><span class="sw">${[v[1],v[2],v[3]].map(c=>`<i style="background:${c}"></i>`).join('')}</span>${v[0]}</button>`).join('')}</section>
 <section><h2>Typography</h2>${seg('font',Object.entries(F).map(([k,v])=>[k,v[0],v[1]]),'v',1)}</section>
 <section><h2>Line style</h2>${seg('line',Object.entries(LS),'',2)}</section>
 <section><h2>Header and dates</h2><label class="lb" for="title">Planner title</label><input class="in" id="title"><label class="ck2"><input type="checkbox" id="showDate"><span>Fill in dates<small>Off leaves date fields blank for handwriting</small></span></label><label class="lb" for="date" id="dl">Date</label><input class="in" type="date" id="date"><label class="lb">Week starts on</label>${seg('ws',[['mon','Monday'],['sun','Sunday']])}</section>
 <section><h2>Binder layout</h2><label class="ck2"><input type="checkbox" id="binder"><span>Hole-punch safe zone<small>Adds 8 mm to the inner margin for ring binders</small></span></label></section>
 <section><h2>Export range</h2><div class="seg v" style="grid-template-columns:1fr"><button data-k="scope" data-v="single">Single page</button><button data-k="scope" data-v="batch" id="batch"></button></div></section>
 <section><h2>Reset</h2><button class="btn" id="rh">Reset headings</button> <button class="btn" id="ra">Reset everything</button></section>`;
 $('#zoom').innerHTML=[50,75,100].map(z=>`<button data-k="zoom" data-v="${z}">${z}%</button>`).join('')}
function sync(){
 document.querySelectorAll('[data-k]').forEach(b=>b.classList.toggle('on',String(S[b.dataset.k])===b.dataset.v));
 const dl={daily:'Date',weekly:'Any day in the week',monthly:'Month',habit:'Month'};
 $('#dl').textContent=dl[S.tpl];$('#psz').textContent=P[S.paper].s;
 $('#batch').textContent=batchLabel()+(S.showDate?'':' (turn on dates)');$('#batch').disabled=!S.showDate;
 if(document.activeElement!==$('#title'))$('#title').value=S.title;
 $('#showDate').checked=S.showDate;$('#binder').checked=S.binder;$('#date').value=S.date;$('#date').disabled=!S.showDate}
function draw(){
 const ps=pages();pi=Math.min(pi,ps.length-1);const p=P[S.paper],k=S.zoom/100,w=p.w*96/25.4,h=p.h*96/25.4;
 $('#box').style.cssText=`width:${w*k}px;height:${h*k}px`;
 $('#inner').style.cssText=`width:${w}px;height:${h}px;transform:scale(${k})`;
 $('#inner').innerHTML=page(ps[pi],true);
 $('#nav').style.display=ps.length>1?'flex':'none';$('#pn').textContent=` ${pi+1} of ${ps.length} `;
 $('#prev').disabled=pi===0;$('#next').disabled=pi===ps.length-1}
function all(){save();sync();draw()}
document.addEventListener('click',e=>{const b=e.target.closest('[data-k]');if(!b||b.disabled)return;const k=b.dataset.k;S[k]=k==='zoom'?+b.dataset.v:b.dataset.v;all()});
$('#side').addEventListener('input',e=>{const t=e.target;if(t.id==='title'){S.title=t.value;save();draw()}});
$('#side').addEventListener('change',e=>{const t=e.target;if(t.id==='showDate'){S.showDate=t.checked;all()}else if(t.id==='binder'){S.binder=t.checked;all()}else if(t.id==='date'&&t.value){S.date=t.value;all()}});
$('#rh').onclick=()=>{S.heads={};all()};$('#ra').onclick=()=>{S=Object.assign({},DEF,{date:iso(new Date()),heads:{}});all()};
$('#prev').onclick=()=>{pi--;draw()};$('#next').onclick=()=>{pi++;draw()};
$('#inner').addEventListener('focusout',e=>{const h=e.target.dataset&&e.target.dataset.h;if(!h)return;const v=e.target.textContent.trim();if(h==='__t'){S.title=v;$('#title').value=v}else S.heads[h]=v;save()});
$('#inner').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.h){e.preventDefault();e.target.blur()}});
function mount(){const p=P[S.paper],ex=document.createElement('div');ex.id='ex';ex.innerHTML=`<style>@page{size:${p.w}mm ${p.h}mm;margin:0}</style>`+pages().map(d=>page(d,false)).join('');EDIT=true;document.body.appendChild(ex);return ex}
const unmount=()=>{const e=$('#ex');if(e)e.remove()};
$('#print').onclick=()=>{mount();window.print()};
window.addEventListener('beforeprint',()=>{if(!$('#ex'))mount()});window.addEventListener('afterprint',unmount);
$('#pdf').onclick=async()=>{
 const btn=$('#pdf'),p=P[S.paper];btn.disabled=true;
 try{
  if(!window.jspdf||!window.html2canvas)throw new Error('PDF libraries did not load. Check your internet connection.');
  const root=mount();await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));await document.fonts.ready;
  const doc=new jspdf.jsPDF({unit:'mm',format:[p.w,p.h],compress:true}),els=[...root.querySelectorAll('[data-pg]')];
  for(let i=0;i<els.length;i++){
   btn.textContent=`Exporting ${i+1} of ${els.length}`;
   const c=await html2canvas(els[i],{scale:3,backgroundColor:'#ffffff',logging:false,onclone:(_,el)=>{let n=el;while(n&&n.id!=='ex')n=n.parentElement;if(n){n.style.left='0px';n.style.top='0px'}}});
   if(i)doc.addPage([p.w,p.h]);doc.addImage(c.toDataURL('image/png'),'PNG',0,0,p.w,p.h,undefined,'FAST');await new Promise(r=>setTimeout(r))}
  doc.save((S.title.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'planner')+`-${S.tpl}-${S.paper}.pdf`);
 }catch(err){alert('Export failed: '+err.message)}
 finally{unmount();btn.disabled=false;btn.textContent='Download PDF'}};
buildSide();all();
</script>
</body>
</html>
